# AI 伺服器（有 NVIDIA 顯示卡的電腦；Windows 用 Docker Desktop + WSL2）。
#
#   cd deploy
#   KARA_NAS=http://mac-mini.local:8765 docker compose -f compose.ai.yml up -d --build
#
# 第一次處理時會下載模型（Whisper、MMS、Demucs，約 5 GB）到 kara-models，之後重建映像不必重新下載。
services:
  kara-ai:
    image: kara-ai:latest
    build:
      context: ..
      dockerfile: deploy/ai.Dockerfile
    container_name: kara-ai
    restart: unless-stopped
    environment:
      KARA_NAS: ${KARA_NAS:?請設定 KARA_NAS，例如 http://mac-mini.local:8765}
      KARA_WORKER_NAME: ${KARA_WORKER_NAME:-pc-gpu}
      KARA_WORKER_TOKEN: ${KARA_WORKER_TOKEN:-}
    volumes:
      - kara-models:/models
      - kara-ai-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    stop_grace_period: 10s

volumes:
  kara-models:
    name: kara-models
  kara-ai-cache:
    name: kara-ai-cache
