# v2：NAS 伺服器（Go + Svelte）與 AI worker（Python）的建置與測試。
name: v2

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: nas/web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 前端
        working-directory: nas/web
        run: |
          npm ci
          npm run check
          npm run build
      - name: ffmpeg、Noto CJK 字型（整合測試用）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./nas/cmd/...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install pytest fugashi unidic-lite pykakasi pypinyin pillow numpy
      - run: python -m pytest -q

  # NAS 映像（amd64 與 Mac 用的 arm64）建得起來；只建置不推送
  nas-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: 建置並檢查工具
        run: |
          docker buildx build --platform linux/amd64 -f deploy/nas.Dockerfile -t kara-nas:ci --load .
          docker run --rm --entrypoint sh kara-nas:ci -c 'ffmpeg -version >/dev/null && $KARA_TOOLS/yt-dlp --version && $KARA_TOOLS/deno --version && kara-nas openapi >/dev/null'
          docker buildx build --platform linux/arm64 -f deploy/nas.Dockerfile .
